name: DEFCON-1 Cyberdefense Gate

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 6 * * 1' # Weekly automated security audit

permissions:
  contents: read

concurrency:
  group: defcon-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-regression-tests:
    name: Automated Unit & Regression Tests (DEFCON-1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Run Python Test Suite (Unittest)
        run: |
          python -m unittest discover tests/ -v

  codebase-audit:
    name: Military-Grade Baseline & Diff Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Verify Project SSOT & Configuration Parity
        run: |
          python ./scripts/sync-and-validate.py --check

      - name: Run DEFCON-1 Code Baseline Scanner
        run: |
          python ./scripts/check-security-baseline.py . --sarif security-report.sarif

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: security-report.sarif
          category: defcon-code-defense

  supply-chain-audit:
    name: Google OSV Supply Chain & Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Run DEFCON-1 Google OSV Dependency Scanner
        run: |
          python ./scripts/check-dependencies-osv.py . --sarif osv-results.sarif

      - name: Upload OSV SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: osv-results.sarif
          category: google-osv-supply-chain

  container-and-iac-audit:
    name: Aqua Trivy Container & IaC Misconfiguration Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run Aqua Security Trivy (IaC & Dockerfile Scanner)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          hide-progress: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: aqua-trivy-iac

  verified-secrets-audit:
    name: TruffleHog Live-Verified Secret Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog OSS (Active Key Verification - Pinned Version)
        uses: trufflesecurity/trufflehog@v3.88.15
        with:
          path: ./
          extra_args: --only-verified

  agent-skills-audit:
    name: NVIDIA SkillSpector & Agent Skill Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Audit Agent Skills & Prompts (Steganography & Injection Focus)
        run: |
          python3 ./scripts/check-security-baseline.py . --sarif skills-audit.sarif

      - name: Upload Agent Skills SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: skills-audit.sarif
          category: agent-skills-defense
