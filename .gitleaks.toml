# DEFCON-1 Military-Grade Gitleaks Configuration
# Official standard: https://github.com/gitleaks/gitleaks

[extend]
useDefault = true

[allowlist]
description = "Global Allowlist for Safe Non-Secret Paths, Rules, and Hashes"
paths = [
  '''^\.gitleaks\.toml$''',
  '''^templates/\.gitleaks\.toml$''',
  '''^rules/security-rules\.json$''',
  '''^scripts/check-security-baseline\.py$''',
  '''^scripts/check-security-baseline\.ps1$''',
  '''^tests/.*$''',
  '''package-lock\.json$''',
  '''pnpm-lock\.yaml$''',
  '''Cargo\.lock$''',
  '''poetry\.lock$''',
  '''go\.sum$''',
  '''\.env\.example$'''
]

# Custom High-Severity Secret Rules
[[rules]]
id = "defcon-private-key"
description = "Unencrypted Private Key Block"
regex = '''-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'''
tags = ["key", "asymmetric", "critical"]

[[rules]]
id = "defcon-aws-access-key"
description = "AWS Access Key ID"
regex = '''(?i)\b(AKIA[0-9A-Z]{16})\b'''
tags = ["cloud", "aws", "critical"]

[[rules]]
id = "defcon-github-pat"
description = "GitHub Personal Access Token"
regex = '''\b(ghp|gho|ghu|ghs|ghr)_[0-9a-zA-Z]{36}\b'''
tags = ["vcs", "github", "critical"]

[[rules]]
id = "defcon-stripe-secret"
description = "Stripe Live API Key"
regex = '''\bsk_live_[0-9a-zA-Z]{24}\b'''
tags = ["payment", "stripe", "critical"]

[[rules]]
id = "defcon-google-api-key"
description = "Google / Firebase / Gemini API Key"
regex = '''\bAIza[0-9A-Za-z\-_]{35}\b'''
tags = ["google", "api", "critical"]

[[rules]]
id = "defcon-openai-key"
description = "OpenAI API Project or Legacy Secret Key"
regex = '''\bsk-(proj-)?[a-zA-Z0-9_\-]{32,}\b'''
tags = ["ai", "openai", "critical"]

[[rules]]
id = "defcon-anthropic-key"
description = "Anthropic Claude API Key"
regex = '''\bsk-ant-api[0-9]{2}-[a-zA-Z0-9_\-]{80,}\b'''
tags = ["ai", "anthropic", "critical"]

[[rules]]
id = "defcon-huggingface-token"
description = "Hugging Face User Access Token"
regex = '''\bhf_[a-zA-Z0-9]{34}\b'''
tags = ["ai", "huggingface", "critical"]
