name: DEFCON-1 Cyberdefense Gate

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 6 * * 1' # Weekly automated security audit

permissions:
  contents: read

concurrency:
  group: defcon-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-regression-tests:
    name: Automated Unit & Regression Tests (DEFCON-1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Run Python Test Suite (Unittest)
        run: |
          python -m unittest discover tests/ -v

  codebase-audit:
    name: Military-Grade Baseline & Diff Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Verify Project SSOT & Configuration Parity
        run: |
          python ./scripts/sync-and-validate.py --check

      - name: Run DEFCON-1 Code Baseline Scanner
        run: |
          python ./scripts/check-security-baseline.py . --sarif security-report.sarif

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.10
        if: always()
        with:
          sarif_file: security-report.sarif
          category: defcon-code-defense

  supply-chain-audit:
    name: Google OSV Supply Chain & Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Run DEFCON-1 Google OSV Dependency Scanner
        run: |
          python ./scripts/check-dependencies-osv.py . --sarif osv-results.sarif

      - name: Upload OSV SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.10
        if: always()
        with:
          sarif_file: osv-results.sarif
          category: google-osv-supply-chain

  container-and-iac-audit:
    name: Aqua Trivy Container, IaC & SBOM Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run Aqua Security Trivy (IaC & Dockerfile Configuration Scanner)
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # v0.36.0
        with:
          scan-type: 'config'
          hide-progress: true
          format: 'sarif'
          output: 'trivy-config-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy IaC SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.10
        if: always()
        with:
          sarif_file: trivy-config-results.sarif
          category: aqua-trivy-iac

      - name: Run Aqua Security Trivy (Filesystem Package & Dependency Vulnerability Scanner)
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # v0.36.0
        with:
          scan-type: 'fs'
          hide-progress: true
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Filesystem SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.10
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
          category: aqua-trivy-filesystem

      - name: Generate CycloneDX SBOM (Software Bill of Materials)
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # v0.36.0
        with:
          scan-type: 'fs'
          format: 'cyclonedx'
          output: 'sbom.cdx.json'

      - name: Upload CycloneDX SBOM Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: software-bill-of-materials
          path: sbom.cdx.json

  verified-secrets-audit:
    name: TruffleHog Live-Verified Secret Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog OSS (Active Key Verification - Pinned Version)
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          path: ./
          extra_args: --only-verified

  agent-skills-audit:
    name: DEFCON-1 Agent Skills & Prompts Defense Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Audit Agent Skills & Prompts (Steganography & Injection Focus)
        run: |
          python3 ./scripts/check-security-baseline.py . --sarif skills-audit.sarif

      - name: Upload Agent Skills SARIF
        uses: github/codeql-action/upload-sarif@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.10
        if: always()
        with:
          sarif_file: skills-audit.sarif
          category: agent-skills-defense
